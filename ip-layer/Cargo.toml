[package]
name    = "ip-layer"
version = "0.1.0"
edition = "2021"
description = "Ọmọ Kọ́dà IP Layer — agent IP identity and provenance on Nostr (kinds 31900/1901/1902/1903)"

[dependencies]
sovereign-types  = { path = "../sovereign-types" }
sovereign-runtime = { path = "../sovereign-runtime" }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
sha2             = "0.10"
hex              = "0.4"
uuid             = { version = "1", features = ["v4"] }
thiserror        = "1"
# secp256k1 Schnorr for NIP-01 Nostr event signing (BIP-340)
k256             = { version = "0.13", features = ["schnorr", "ecdsa"] }
# WebSocket publisher — optional, only needed for live relay publishing
tokio            = { version = "1", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.24", features = ["native-tls"], optional = true }

[features]
default   = []
publisher = ["tokio", "tokio-tungstenite"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
