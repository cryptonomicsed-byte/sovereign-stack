[workspace]
resolver = "2"
members = [
    # Core types
    "sovereign-types",
    "sovereign-runtime",
    # Protocol crates
    "ip-layer",
    "dip",
    "vcp",
    "twin-protocol",
    "arp-types",
    "arp-broker",
    # UCX — Universal Compute Exchange
    "ucx-protocol",
    "ucx-provider",
    "ucx-broker",
    # ScarabSwarm — simulation
    "swarm-types",
    "swarm-broker",
    # Witness — attestation
    "witness-types",
    "witness-broker",
    # Node / infra
    "sovereign-pipeline",
    "sovereign-a2a",
    "sovereign-node",
    "sovereign-cli",
    "sovereign-os",
    "mycelium-finetune",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
uuid         = { version = "1",    features = ["v4", "serde"] }
thiserror    = "1"
sha2         = "0.10"
hex          = "0.4"
chrono       = { version = "0.4",  features = ["serde"] }
tokio        = { version = "1",    features = ["full"] }
axum         = "0.7"
reqwest      = { version = "0.12", features = ["json"] }
