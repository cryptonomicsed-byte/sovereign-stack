[package]
name = "twin-protocol"
version = "0.1.0"
edition = "2021"
description = "Twin & Simulation Protocol — TSP/1"

[dependencies]
sovereign-types = { path = "../sovereign-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
