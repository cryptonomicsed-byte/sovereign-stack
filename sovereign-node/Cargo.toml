[package]
name = "sovereign-node"
version = "0.1.0"
edition = "2021"
description = "Sovereign Node — Arch Linux daemon wiring DIP + VCP + TSP + pipeline"

[[bin]]
name = "sovereign-node"
path = "src/main.rs"

[lib]
name = "sovereign_node"
path = "src/lib.rs"

[dependencies]
sovereign-types    = { path = "../sovereign-types" }
sovereign-runtime  = { path = "../sovereign-runtime" }
sovereign-os       = { path = "../sovereign-os" }
ip-layer           = { path = "../ip-layer" }
vcp                = { path = "../vcp" }
twin-protocol      = { path = "../twin-protocol" }
dip                = { path = "../dip" }
sovereign-pipeline = { path = "../sovereign-pipeline" }
sovereign-a2a      = { path = "../sovereign-a2a" }

serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
reqwest            = { version = "0.12", features = ["json"] }
tokio-tungstenite  = { version = "0.24", features = ["native-tls"] }
futures-util       = "=0.3.32"
toml               = "0.8"
uuid               = { version = "1", features = ["v4"] }
thiserror          = "1"
tokio              = { version = "1", features = ["full"] }
axum               = { version = "0.7", features = ["ws"] }
tower              = "0.4"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap               = { version = "4", features = ["derive"] }
base64             = "0.22"
ed25519-dalek      = { version = "2", features = ["serde"] }
sha2               = "0.10"
hex                = "0.4"

[dev-dependencies]
http      = "1"
tower     = { version = "0.4", features = ["util"] }
