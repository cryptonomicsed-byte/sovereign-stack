# sovereign-node configuration
# Copy to /etc/sovereign-node/config.toml and edit.

[node]
name      = "my-sovereign-node"
data_dir  = "/var/lib/sovereign-node"
log_level = "info"

[identity]
key_file = "/var/lib/sovereign-node/node.key"
did_file = "/var/lib/sovereign-node/node.did"

[vcp]
scan_interval_secs = 30
device_ttl_secs    = 120
# Paths to JSON manifests for USB-connected devices:
# manual_devices = ["/etc/sovereign-node/devices/go2.json"]
manual_devices = []

[dip]
nostr_enabled = false
# nostr_relay = "wss://relay.damus.io"
# nostr_npub  = "npub1..."
vantage_did          = "did:vantage:api:receipts"
# poll_interval_secs = 30   # poll Vantage for queued DIP envelopes (NAT traversal); 0 = disabled

[pipeline]
reconstruction_engine = "nerfstudio/gaussian-splatting"
osovm_version         = "osovm/2.0"
trajectory_count      = 6
selection_objective   = "balanced"
min_witnesses         = 2
# Optional real ỌSỌVM engine:
# osovm_endpoint = "http://localhost:9000"     # HTTP JSON bridge
# osovm_endpoint = "/usr/local/bin/osovm"      # binary exec (JSON stdin/stdout)

# Optional Gaussian splatting engine:
# splat_bin        = "ns-train"                # nerfstudio on PATH
# splat_bin        = "/path/to/gsplat/train.py"  # standalone gsplat
# splat_output_dir = "/var/lib/sovereign-node/splats"
# splat_steps      = 1000

[api]
bind    = "127.0.0.1:7779"
enabled = true

# Optional: Vantage backend integration
# [vantage]
# base_url  = "https://your-vantage-instance.example.com"
# api_token = "your-token-here"

# Optional: Sui blockchain anchor
# [sui]
# rpc_url  = "https://fullnode.mainnet.sui.io"
# address  = "0xyour_sui_address"
# key_file = "/var/lib/sovereign-node/sui.key"

# Optional: Meshtastic device HTTP bridge (LoRa offline mesh)
# When set, DIP envelopes are POSTed to {device_url}/api/v1/toRadio
# [meshtastic]
# device_url  = "http://192.168.4.1"   # Meshtastic device AP mode IP
# dip_channel = 1                       # encrypted channel for DIP traffic

# Witness peers — co-sign ỌSỌVM simulation proofs.
# Requires >= 2 to avoid ephemeral stub witnesses.
# [[witnesses]]
# did        = "did:vantage:node:peer01"
# public_key = "base64url_ed25519_verifying_key"
#
# [[witnesses]]
# did        = "did:vantage:node:peer02"
# public_key = "base64url_ed25519_verifying_key"
