[package]
name    = "sovereign-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sovereign"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive", "env"] }
reqwest    = { version = "0.12", features = ["json", "blocking"] }
serde_json = "1"
tokio      = { version = "1", features = ["rt-multi-thread", "macros"] }
