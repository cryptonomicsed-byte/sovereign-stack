[package]
name    = "sovereign-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
sovereign-types = { path = "../sovereign-types" }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
uuid             = { version = "1", features = ["v4"] }
tokio            = { version = "1", features = ["full"] }
thiserror        = "1"
sha2             = "0.10"
hex              = "0.4"
