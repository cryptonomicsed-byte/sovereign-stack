[package]
name        = "ucx-broker"
version     = "0.1.0"
edition     = "2021"
description = "UCX matching engine — native-first allocation with external overflow routing."

[[bin]]
name = "ucx-broker"
path = "src/bin/main.rs"

[dependencies]
ucx-protocol       = { path = "../ucx-protocol" }
ucx-provider       = { path = "../ucx-provider" }
serde              = { workspace = true }
serde_json         = { workspace = true }
uuid               = { workspace = true }
thiserror          = { workspace = true }
reqwest            = { version = "0.12", features = ["json"] }
tracing            = "0.1"
axum               = "0.8"
tokio              = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"

# Optional external network adapters — enabled via cargo features.
ucx-adapter-gpu-ai = { path = "../ucx-adapters/gpu-ai", optional = true }
ucx-adapter-akash  = { path = "../ucx-adapters/akash",  optional = true }
ucx-adapter-vast   = { path = "../ucx-adapters/vast",   optional = true }

[features]
gpu-ai       = ["dep:ucx-adapter-gpu-ai"]
akash        = ["dep:ucx-adapter-akash"]
vast         = ["dep:ucx-adapter-vast"]
all-adapters = ["gpu-ai", "akash", "vast"]
