version: "3.9"

services:
  veilsim-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8788:8788"
    environment:
      - VEILSIM_DATA_DIR=/app/data
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8788/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
