[package]
name = "sovereign-pipeline"
version = "0.1.0"
edition = "2021"
description = "Integration pipeline: VCP session → TSP capture → scene assembly → Sui anchor"

[dependencies]
sovereign-types = { path = "../sovereign-types" }
vcp = { path = "../vcp" }
twin-protocol = { path = "../twin-protocol" }
dip = { path = "../dip" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tungstenite = { version = "0.24", features = ["native-tls"] }
