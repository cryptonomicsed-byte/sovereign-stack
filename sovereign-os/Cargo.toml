[package]
name    = "sovereign-os"
version = "0.1.0"
edition = "2021"
description = "Sovereign OS Layer 3 — Omo-Koda Runtime (Agent Substrate)"

[dependencies]
sovereign-types   = { path = "../sovereign-types" }
sovereign-runtime = { path = "../sovereign-runtime" }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
uuid              = { version = "1", features = ["v4"] }
tokio             = { version = "1", features = ["full"] }
thiserror         = "1"
sha2              = "0.10"
hex               = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
