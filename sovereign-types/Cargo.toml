[package]
name = "sovereign-types"
version = "0.1.0"
edition = "2021"
description = "Canonical shared types for DIP, VCP, and TSP protocols"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
thiserror = "1"
